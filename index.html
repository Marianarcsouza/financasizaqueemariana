<script>

function fmt(n){n=Math.round((n||0)*100)/100;var neg=n<0;var p=Math.abs(n).toFixed(2).split('.');return (neg?'-':'')+'€'+p[0].replace(/\B(?=(\d{3})+(?!\d))/g,'.')+','+p[1];}
function num(v){if(typeof v==='number')return v;var s=String(v==null?'':v).replace(/[€\s]/g,'');if(!s)return NaN;if(s.indexOf(',')>=0)s=s.replace(/\./g,'').replace(',','.');var n=Number(s);return isFinite(n)?Math.round(n*100)/100:NaN;}

function fromDocs(docs){
 var d=emptyP();
 if(docs.cfg){['categorias','formas','contas','tipos','rec'].forEach(function(k){if(Array.isArray(docs.cfg[k]))d.cfg[k]=clone(docs.cfg[k]);});if(docs.cfg.saldos&&typeof docs.cfg.saldos==='object')d.cfg.saldos=clone(docs.cfg.saldos);}

/* ---------- armazenamento (base de dados partilhada, com reserva local) ---------- */
var mem={};

 db:null,

function persist(p,id){
 if(!S.ready[p]||S.blocked[p]){toast('Sem ligação à base de dados: alteração não guardada.');return;}
 var key=p+'/'+id;pend[key]=true;if(run[key])return;run[key]=true;
 (async function(){
  try{
   while(pend[key]){pend[key]=false;await Store.set(p,id,docData(p,id));}
  }catch(e){
   var c=e&&e.code;
   toast(c==='invalid_argument'?'Sem permissão para guardar. Peça acesso com "Pode interagir".':c==='quota_exceeded'?'Limite de armazenamento atingido.':'Não foi possível guardar. Tente novamente.');
  }
  run[key]=false;
 })();
}

/* ---------- registos ---------- */
function bucket(p,y){var a=S.data[p].anos;return a[y]||(a[y]={entradas:[],despesas:[],transferencias:[]});}
function addR(p,kind,r){var y=r.data.slice(0,4);var b=bucket(p,y);if(!b[kind])b[kind]=[];b[kind].push(r);persist(p,'a'+y);}
function locate(p,id){var an=S.data[p].anos;for(var y in an){var ks=['entradas','despesas','transferencias'];for(var j=0;j<ks.length;j++){var arr=an[y][ks[j]]||(an[y][ks[j]]=[]);for(var i=0;i<arr.length;i++){if(arr[i].id===id)return {y:y,kind:ks[j],arr:arr,i:i,r:arr[i]};}}}return null;}
function delR(p,id){var l=locate(p,id);if(!l)return;l.arr.splice(l.i,1);persist(p,'a'+l.y);}
function putR(p,r){
 var l=locate(p,r.id);if(!l)return;var ny=r.data.slice(0,4);
 if(ny===l.y){l.arr[l.i]=r;persist(p,'a'+l.y);}
 else{l.arr.splice(l.i,1);persist(p,'a'+l.y);bucket(p,ny)[l.kind].push(r);persist(p,'a'+ny);}
}
function grupoOf(p,g){var o=[];var an=S.data[p].anos;for(var y in an)an[y].despesas.forEach(function(x){if(x.grupo===g)o.push(x);});return o.sort(function(a,b){return a.n-b.n;});}

/* ---------- recorrentes ---------- */
function verAt(rec,k){var v=null;rec.versoes.forEach(function(x){if(x.de<=k&&(!v||x.de>=v.de))v=x;});return v;}
function activeAt(rec,k){
 if(k<rec.inicio)return false;if(rec.fim&&k>rec.fim)return false;
 var ps=rec.pausas||[];for(var i=0;i<ps.length;i++){if(k>=ps[i].de&&(!ps[i].ate||k<ps[i].ate))return false;}
 return true;
}
function occ(rec,k){
 if(!activeAt(rec,k))return null;var v=verAt(rec,k);if(!v)return null;
 var ov=(rec.ov||{})[k]||{};
 var dia=Math.min(v.dia,daysIn(+k.slice(0,4),+k.slice(5,7)));
 return {id:'r:'+rec.id+':'+k,kind:'out',src:'rec',recId:rec.id,k:k,nome:v.nome,valor:ov.valor!=null?ov.valor:v.valor,data:k+'-'+pad(dia),categoria:v.categoria,forma:v.forma,conta:v.conta,pessoa:v.pessoa,obs:ov.obs!=null?ov.obs:(rec.obs||''),tv:rec.tipoValor,auto:rec.auto,pago:ov.pago};
}
function isPago(it){if(it.kind!=='out')return false;if(it.pago!==undefined&&it.pago!==null)return !!it.pago;return !!it.auto&&it.data<=hoje();}

/* ---------- contas bancárias ---------- */
function blankAcct(){return {inicial:0,entrou:0,gasto:0,comprometido:0,transfIn:0,transfOut:0};}
function acctStats(p){
 var c=S.data[p].cfg,accounts=c.contas.slice(),saldos=c.saldos||{},stats={};
 accounts.forEach(function(a){stats[a]=blankAcct();stats[a].inicial=num(saldos[a])||0;});
 function ensure(a){if(!stats[a])stats[a]=blankAcct();return stats[a];}
 var scope={};scopeKeys().forEach(function(k){scope[k]=true;});
 var anos=S.data[p].anos;
 for(var y in anos){
  var an=anos[y];
  (an.entradas||[]).forEach(function(e){ensure(e.conta||accounts[0]||'Outros').entrou+=e.valor;});
  (an.despesas||[]).forEach(function(x){
   var s=ensure(x.conta||accounts[0]||'Outros');
   if(isPago(Object.assign({kind:'out'},x)))s.gasto+=x.valor;
   else if(scope[ym(x.data)])s.comprometido+=x.valor;
  });
  (an.transferencias||[]).forEach(function(t){ensure(t.de).transfOut+=t.valor;ensure(t.para).transfIn+=t.valor;});
 }
 var k0=hm(),months={};
 c.rec.forEach(function(r){for(var k=r.inicio;k<=k0;k=addM(k,1))months[k]=true;});
 Object.keys(scope).forEach(function(k){months[k]=true;});
 var monthsArr=Object.keys(months).sort().slice(0,240);
 c.rec.forEach(function(r){
  monthsArr.forEach(function(k){
   if(k<r.inicio)return;
   var o=occ(r,k);if(!o)return;
   var s=ensure(o.conta||accounts[0]||'Outros');
   if(isPago(o))s.gasto+=o.valor;
   else if(scope[k])s.comprometido+=o.valor;
  });
 });
 var out={list:accounts.map(function(a){
  var s=stats[a];
  var saldo=s.inicial+s.entrou-s.gasto+s.transfIn-s.transfOut;
  var disp=saldo-s.comprometido;
  return {nome:a,inicial:s.inicial,entrou:s.entrou,gasto:s.gasto,comprometido:s.comprometido,transfIn:s.transfIn,transfOut:s.transfOut,saldo:saldo,disponivel:disp,falta:disp<0?-disp:0};
 })};
 out.tot=out.list.reduce(function(a,x){a.saldo+=x.saldo;a.entrou+=x.entrou;a.gasto+=x.gasto;a.comprometido+=x.comprometido;a.disponivel+=x.disponivel;return a;},{saldo:0,entrou:0,gasto:0,comprometido:0,disponivel:0});
 out.transferir=out.list.reduce(function(a,x){return a+x.falta;},0);
 return out;
}

function inScope(k){var y=k.slice(0,4),m=+k.slice(5,7);return (S.ano==='all'||y===S.ano)&&S.meses.has(m);}
function scopeKeys(){
 var out=[],i;
 if(S.ano!=='all'){Array.from(S.meses).sort(function(a,b){return a-b;}).forEach(function(m){out.push(S.ano+'-'+pad(m));});return out;}
 var min=hm(),max=addM(hm(),11);
 P.forEach(function(p){var d=S.data[p];for(var y in d.anos){d.anos[y].entradas.concat(d.anos[y].despesas).forEach(function(it){var k=ym(it.data);if(k<min)min=k;if(k>max)max=k;});}d.cfg.rec.forEach(function(r){if(r.inicio<min)min=r.inicio;});});
 for(var k=min;k<=max;k=addM(k,1)){if(S.meses.has(+k.slice(5)))out.push(k);}
 return out;
}
function itemsOf(p){
 var d=S.data[p],out=[];
 for(var y in d.anos){
  var a=d.anos[y];
  a.entradas.forEach(function(e){if(inScope(ym(e.data))){var o=clone(e);o.kind='in';o._p=p;o.pessoa=NOME[p];out.push(o);}});
  a.despesas.forEach(function(x){if(inScope(ym(x.data))){var o=clone(x);o.kind='out';o.src=x.grupo?'parc':'man';o._p=p;out.push(o);}});
 }
 scopeKeys().forEach(function(k){d.cfg.rec.forEach(function(r){var o=occ(r,k);if(o){o._p=p;out.push(o);}});});
 return out.sort(cmp);
}
function summ(items){
 var s={entrou:0,saiu:0,pago:0,nao:0};
 items.forEach(function(it){if(it.kind==='in')s.entrou+=it.valor;else{s.saiu+=it.valor;if(isPago(it))s.pago+=it.valor;else s.nao+=it.valor;}});
 s.rest=s.entrou-s.saiu;s.disp=s.entrou-s.pago;return s;
}
function applyFilters(items,f){
 return items.filter(function(it){
  if(f.pessoa&&it.pessoa!==f.pessoa)return false;
  if(it.kind==='in'){if(f.categoria||f.forma||f.conta||f.status)return false;if(f.tipo&&it.tipo!==f.tipo)return false;return true;}
  if(f.tipo)return false;
  if(f.categoria&&it.categoria!==f.categoria)return false;
  if(f.forma&&it.forma!==f.forma)return false;
  if(f.conta&&it.conta!==f.conta)return false;
  if(f.status==='pago'&&!isPago(it))return false;
  if(f.status==='naopago'&&isPago(it))return false;
  return true;
 });
}
function upcoming(p){
 var hj=hoje(),d=S.data[p],out=[];
 for(var y in d.anos)d.anos[y].despesas.forEach(function(x){var it=clone(x);it.kind='out';it._p=p;if(!isPago(it))out.push(it);});
 for(var i=0;i<4;i++){var k=addM(hm(),i);d.cfg.rec.forEach(function(r){var o=occ(r,k);if(o&&!isPago(o)){o._p=p;out.push(o);}});}
 out=out.filter(function(it){return it.data>=hj||true;});
 return out.sort(cmp).filter(function(it){return it.data>=addM(hm(),-2)+'-01';}).slice(0,10);
}

function refreshParc(form,src){

 var n=Math.max(2,Math.min(120,parseInt(fv(form,'n'),10)||2)),custom=form.elements.custom.checked,total=num(fv(form,'valor')),data=fv(form,'data');

 var vals;

  vals=M.pv;
 }else{vals=isNaN(total)?new Array(n).fill(NaN):splitEven(total,n);M.pv=[];}
 M.pvn=n;M.pvc=custom;
 var dia=data?+data.slice(8):1;

function applyEdit(p,orig,nv,statusNew,scope){
 var g=orig.grupo?grupoOf(p,orig.grupo):[orig],targets,cur=hm();
 var pg=function(x){return isPago(Object.assign({kind:'out'},x));};
 if(scope==='esta'||!orig.grupo)targets=[orig];
 else if(scope==='seguintes')targets=g.filter(function(x){return x.n>=orig.n&&(x.id===orig.id||!pg(x));});
 else targets=g.filter(function(x){return ym(x.data)>=cur&&!pg(x);});
 var done=false;
 targets.forEach(function(t){
  var r=clone(t);
  ['nome','categoria','forma','conta','pessoa','obs','auto','valor'].forEach(function(k){if(nv[k]!==orig[k])r[k]=nv[k];});
  if(nv.data!==orig.data){
   if(t.id===orig.id)r.data=nv.data;
   else{var dia=+nv.data.slice(8),y=+t.data.slice(0,4),m=+t.data.slice(5,7);r.data=y+'-'+pad(m)+'-'+pad(Math.min(dia,daysIn(y,m)));}
  }
  if(t.id===orig.id){done=true;if(statusNew!==undefined){if(statusNew==='paga')r.pago=true;else if(r.auto)delete r.pago;else r.pago=false;}}
  putR(p,r);
 });
 if(!done&&statusNew!==undefined){var r=clone(orig);if(statusNew==='paga')r.pago=true;else if(r.auto)delete r.pago;else r.pago=false;putR(p,r);}
}

  confirmBox('Eliminar recorrência','Eliminar “'+esc(r.versoes[0].nome)+'” apaga também todo o histórico desta recorrência. Para manter o histórico, use Encerrar.',function(){var c=S.data[d.p].cfg;c.rec=c.rec.filter(function(x){return x.id!==d.rid;});persist(d.p,'cfg');render();toast('Eliminada.');},'Eliminar',true);
 }
};
var FORMS={
 entrada:function(f){
  var p=M.p,valor=num(f.valor);
  if(!f.nome.trim())return toast('Indique a descrição.');
  if(isNaN(valor)||valor<=0)return toast('Indique um valor válido.');
  if(!f.data)return toast('Indique a data.');
  if(f.tipo==='__new__'||f.conta==='__new__')return toast('Adicione a nova opção ou escolha uma existente.');
  var r={id:M.edit?M.edit.id:uid(),nome:f.nome.trim(),valor:valor,data:f.data,tipo:f.tipo,conta:f.conta,obs:f.obs||''};
  if(M.edit)putR(p,r);else addR(p,'entradas',r);
  closeModal();render();toast('Entrada guardada.');
 },
 despesa:function(f,form){
  var p=M.p,valor=num(f.valor),modo=M.edit?'unica':(f.modo||'unica');
  if(!f.nome.trim())return toast('Indique o nome da despesa.');
  if(!f.data)return toast('Indique a data.');
  if(f.categoria==='__new__'||f.forma==='__new__'||f.conta==='__new__')return toast('Adicione a nova opção ou escolha uma existente.');
  var base={nome:f.nome.trim(),categoria:f.categoria,forma:f.forma,conta:f.conta,pessoa:f.pessoa,obs:f.obs||'',auto:!!f.auto};
  if(modo==='parcelada'){
   var n=Math.max(2,Math.min(120,parseInt(f.n,10)||2)),vals;
   if(f.custom){vals=[];for(var i=0;i<n;i++){var v=num(f['pv'+i]);if(isNaN(v)||v<0)return toast('Verifique o valor da parcela '+(i+1)+'.');vals.push(v);}}
   else{if(isNaN(valor)||valor<=0)return toast('Indique o valor total.');vals=splitEven(valor,n);}
   if(vals.reduce(function(a,b){return a+b;},0)<=0)return toast('O total das parcelas deve ser maior que zero.');
   var g=uid(),dia=+f.data.slice(8);
   vals.forEach(function(v,i){var r=Object.assign({id:uid(),valor:v,data:addMonthsISO(f.data,i,dia),grupo:g,n:i+1,de:n},base);addR(p,'despesas',r);});
   closeModal();render();toast('Compra parcelada criada ('+n+' parcelas).');return;
  }
  if(isNaN(valor)||valor<0)return toast('Indique um valor válido.');
  if(M.edit){
   var orig=M.edit,nv=Object.assign({valor:valor,data:f.data},base);
   var statusNew=f.status!==M.st0?f.status:undefined;
   var ch=['nome','categoria','forma','conta','pessoa','obs','auto','valor','data'].some(function(k){return nv[k]!==orig[k];});
   if(orig.grupo&&grupoOf(p,orig.grupo).length>1&&ch){M.pending={orig:orig,nv:nv,statusNew:statusNew};escopoModal();return;}
   applyEdit(p,orig,nv,statusNew,'esta');closeModal();render();toast('Despesa atualizada.');return;
  }
  var r2=Object.assign({id:uid(),valor:valor,data:f.data},base);
  if(f.status==='paga')r2.pago=true;else if(!base.auto)r2.pago=false;
  addR(p,'despesas',r2);closeModal();render();toast('Despesa guardada.');
 },
 rec:function(f){
  var p=M.p,valor=num(f.valor),dia=parseInt(f.dia,10);
  if(!f.nome.trim())return toast('Indique o nome.');
  if(isNaN(valor)||valor<0)return toast('Indique um valor válido.');
  if(!(dia>=1&&dia<=31))return toast('O dia do pagamento deve estar entre 1 e 31.');
  if(f.categoria==='__new__'||f.forma==='__new__'||f.conta==='__new__')return toast('Adicione a nova opção ou escolha uma existente.');
  var ver={nome:f.nome.trim(),valor:valor,dia:dia,categoria:f.categoria,forma:f.forma,conta:f.conta,pessoa:f.pessoa};
  var c=S.data[p].cfg;
  if(!M.rec){
   var ini=mk(f,'ini');
   c.rec.push({id:uid(),inicio:ini,fim:null,pausas:[],tipoValor:f.tv,auto:!!f.auto,obs:f.obs||'',ov:{},versoes:[Object.assign({de:ini},ver)]});
  }else{
   var r=M.rec,from=f.ap==='este'?M.ref:f.ap==='prox'?addM(M.ref,1):mk(f,'apm');
   if(from<M.ref)return toast('Não é possível aplicar a meses anteriores.');
   if(from<r.inicio)from=r.inicio;
   r.versoes=r.versoes.filter(function(x){return x.de<from;});
   r.versoes.push(Object.assign({de:from},ver));r.versoes.sort(function(a,b){return a.de<b.de?-1:1;});
   r.tipoValor=f.tv;r.auto=!!f.auto;r.obs=f.obs||'';
  }
  persist(p,'cfg');closeModal();render();toast('Despesa recorrente guardada.');
 },
 oc:function(f){
  var r=M.rec,k=M.k,valor=num(f.valor);
  if(isNaN(valor)||valor<0)return toast('Indique um valor válido.');
  r.ov=r.ov||{};var ov=r.ov[k]=r.ov[k]||{};
  ov.valor=valor;ov.obs=f.obs||'';
  if(f.status!==M.st0){if(f.status==='paga')ov.pago=true;else if(r.auto)delete ov.pago;else ov.pago=false;}
  persist(M.p,'cfg');closeModal();render();toast('Mês atualizado.');
 },
 pause:function(f){
  var r=S.data[M.p].cfg.rec.find(function(x){return x.id===M.rid;});
  r.pausas=(r.pausas||[]).concat([{de:mk(f,'de'),ate:null}]);
  persist(M.p,'cfg');closeModal();render();toast('Despesa pausada.');
 },
 resume:function(f){
  var r=S.data[M.p].cfg.rec.find(function(x){return x.id===M.rid;}),m=mk(f,'de');
  r.pausas=(r.pausas||[]).map(function(x){if(!x.ate||x.ate>m){if(m<=x.de)return null;return {de:x.de,ate:m};}return x;}).filter(Boolean);
  persist(M.p,'cfg');closeModal();render();toast('Despesa retomada.');
 },
 end:function(f){
  var r=S.data[M.p].cfg.rec.find(function(x){return x.id===M.rid;}),m=mk(f,'fim');
  if(m<r.inicio)return toast('O mês final não pode ser anterior ao início.');
  r.fim=m;persist(M.p,'cfg');closeModal();render();toast('Despesa encerrada.');
 },
 saldoinicial:function(f){
  var p=M.p,valor=num(f.valor);
  if(isNaN(valor))return toast('Indique um valor válido.');
  var c=S.data[p].cfg;c.saldos=c.saldos||{};c.saldos[M.conta]=valor;
  persist(p,'cfg');closeModal();render();toast('Saldo inicial guardado.');
 },
 transferencia:function(f){
  var p=M.p,valor=num(f.valor);
  if(!f.de||!f.para)return toast('Escolha as contas de origem e destino.');
  if(f.de===f.para)return toast('A conta de origem tem de ser diferente da conta de destino.');
  if(isNaN(valor)||valor<=0)return toast('Indique um valor válido.');
  if(!f.data)return toast('Indique a data.');
  var r={id:uid(),de:f.de,para:f.para,valor:valor,data:f.data,obs:f.obs||''};
  addR(p,'transferencias',r);closeModal();render();toast('Transferência registada.');
 }
};

/* ---------- login ---------- */
var memSess=null;
function hex2buf(h){var a=new Uint8Array(h.length/2);for(var i=0;i<a.length;i++)a[i]=parseInt(h.substr(i*2,2),16);return a;}
async function derive(u,s){
 var enc=new TextEncoder();
 var key=await crypto.subtle.importKey('raw',enc.encode(u.trim().toLowerCase()+':'+s),'PBKDF2',false,['deriveBits']);
 var bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:hex2buf(AUTH.salt),iterations:AUTH.iter,hash:'SHA-256'},key,256);
 return Array.from(new Uint8Array(bits)).map(function(b){return pad2(b);}).join('');
}
function pad2(b){return b.toString(16).padStart(2,'0');}
function sessGet(){try{return localStorage.getItem('fc_sessao_v1');}catch(e){return memSess;}}
function sessSet(v){memSess=v;try{localStorage.setItem('fc_sessao_v1',v);}catch(e){}}
FORMS.login=async function(f){
 var err=$('#lerr');err.textContent='';
 try{
  if(!(window.crypto&&crypto.subtle)){err.textContent='É necessária uma ligação segura (https).';return;}
  var h=await derive(f.u||'',f.s||'');
  if(h===AUTH.hash){sessSet(AUTH.hash);await enter();}
  else{await new Promise(function(r){setTimeout(r,700);});err.textContent='Utilizador ou palavra-passe incorretos.';}
 }catch(e){err.textContent='Não foi possível iniciar sessão.';}
};
var started=false;
async function enter(){
 S.logged=true;
 if(!started){
  started=true;
  await Store.init();
  P.forEach(function(p){S.data[p]=emptyP();});
  $('#app').innerHTML=shell('<div class="loading">A carregar os dados…</div>');
  P.forEach(function(p){Store.subscribe(p);});
  setTimeout(function(){P.forEach(function(p){if(!S.ready[p]){S.ready[p]=true;S.blocked[p]=true;S.err='sem resposta';}});render();},12000);
 }
 render();
}

/* ---------- eventos ---------- */
document.addEventListener('click',function(e){
 var t=e.target.closest('[data-act]');if(!t)return;
 var fn=ACT[t.dataset.act];if(fn){if(t.dataset.act!=='ovclose')e.preventDefault();fn(t.dataset,e,t);}
});
document.addEventListener('submit',function(e){
 var form=e.target.closest('form[data-form]');if(!form)return;
 e.preventDefault();
 var f={};new FormData(form).forEach(function(v,k){f[k]=v;});
 var fn=FORMS[form.dataset.form];if(fn)fn(f,form);
});
document.addEventListener('change',function(e){
 var t=e.target;
 if(t.id==='anoSel'){S.ano=t.value;render();return;}
 if(t.dataset&&t.dataset.f){getF(t.dataset.k.split(':')[0],t.dataset.k.split(':')[1])[t.dataset.f]=t.value;render();return;}
 if(t.dataset&&t.dataset.newlist){var nr=t.closest('.f').querySelector('.newrow');if(t.value==='__new__'){nr.hidden=false;nr.querySelector('input').focus();}else nr.hidden=true;}
 if(t.name==='ap'){var b=$('#apBox');if(b)b.hidden=t.value!=='outro';}
 var form=t.closest&&t.closest('form[data-form="despesa"]');if(form)refreshParc(form,t);
});
document.addEventListener('input',function(e){
 var t=e.target;
 if(t.type==='date'){var h=$('#mesHint');if(h&&t.value)h.textContent='Mês: '+fmtMonth(t.value);}
 var form=t.closest&&t.closest('form[data-form="despesa"]');if(form&&(t.name==='valor'||t.name==='data'||t.name==='n'||/^pv\d+$/.test(t.name)))refreshParc(form,t);
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&$('#modal').firstChild)closeModal();});
setInterval(function(){if(S.logged&&!$('#modal').firstChild){var d=hoje();if(setInterval.d!==d){if(setInterval.d)render();setInterval.d=d;}}},60000);

/* ---------- arranque ---------- */
if(sessGet()===AUTH.hash){enter();}else{showLogin();}
})();
